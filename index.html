<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6f0ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Math Quest</title>
<style>
:root{--bg:#e6f0ff;--ink:#1c2b4a;--mut:#6b7a99;--ok:#10b981;--bad:#f97316;--gold:#fbbf24;--pri:#3b5bdb}
*{box-sizing:border-box;margin:0}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:620px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom));padding-top:calc(12px + env(safe-area-inset-top))}
html{-webkit-text-size-adjust:100%}body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ans,.ch{margin-top:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chip{background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:15px}
h1{font-size:28px}h2{font-size:20px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.card{background:#fff;border-radius:20px;padding:14px;text-align:left;border-bottom:6px solid var(--c);box-shadow:0 3px 0 #1c2b4a14}
.card:active{transform:translateY(2px)}
.card b{display:block;font-size:18px}.card span{font-size:26px}
.pips{letter-spacing:3px;color:var(--c);font-size:14px}
.btn{background:var(--pri);color:#fff;font-weight:800;font-size:18px;padding:14px 20px;border-radius:16px;box-shadow:0 4px 0 #1f3aa8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f3aa8}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #c9d6f0}
.btn.go{background:var(--ok);box-shadow:0 4px 0 #0a7a57}
.bar{height:12px;background:#fff;border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.q{background:#fff;border-radius:24px;padding:20px 14px;text-align:center;margin:12px 0}
.q .t{font-size:clamp(30px,9vw,52px);font-weight:800}.q .s{font-size:17px;font-weight:600;line-height:1.5}
.ans{font-size:40px;font-weight:800;min-height:56px;background:#fff;border-radius:16px;text-align:center;padding:4px;margin-bottom:10px;border:3px solid #fff}
.ans.ok{border-color:var(--ok);background:#d1fae5}.ans.bad{border-color:var(--bad);background:#ffedd5}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button,.ch button{background:#fff;border-radius:16px;font-size:28px;font-weight:800;padding:14px 0;box-shadow:0 4px 0 #c9d6f0}
.pad button:active,.ch button:active{transform:translateY(3px);box-shadow:none}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{background:#fff7e0;border-radius:16px;padding:12px;margin:10px 0;font-size:16px;line-height:1.5}
.dots div{letter-spacing:2px;color:var(--pri);font-size:14px;line-height:1.2}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}td,th{padding:8px;text-align:left;border-bottom:1px solid #e3eaf8;font-size:15px}
input.nm{font:inherit;font-size:20px;padding:10px;border-radius:12px;border:2px solid #c9d6f0;width:100%;margin:8px 0}
.big{font-size:64px;text-align:center}
@media(max-width:400px),(max-height:700px){.pad button,.ch button{padding:11px 0;font-size:24px}.ans{font-size:32px;min-height:46px}.q{padding:12px 10px;margin:8px 0}h1{font-size:24px}.card{padding:10px}}
table.col{width:auto;margin:8px auto;background:none;font:700 30px ui-monospace,Menlo,Consolas,monospace}.col td{width:1.5em;padding:2px;text-align:center;border:0}.col .cy{font-size:16px;color:var(--pri);height:22px}.col .bt{border-bottom:3px solid var(--ink)}.col .hi{background:#fef3c7}.col .chg{color:var(--bad)}.col .rs{color:var(--ok)}
.tip{background:#fff;border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.5}.chip.on{background:var(--pri);color:#fff}
table.wk{table-layout:fixed}.wk td,.wk th{text-align:center;padding:6px 1px;font-size:14px}.wk th.td{background:#fef3c7}.wk .fu{background:#f1f4fb}.wk small{font-size:10px}
.hwr{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;margin:6px 0}
@media print{button{display:none!important}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"></main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],sh=a=>a.sort(()=>Math.random()-.5),$=s=>document.querySelector(s);
const K='mathquest.v1';let S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const D=()=>({name:'',xp:0,stars:0,days:0,last:'',speed:0,sk:{},snd:1,talk:0,f:{},tg:{},fm:0,hw:{n:20,on:null,log:{}}});S=Object.assign(D(),S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const sk=id=>S.sk[id]=S.sk[id]||{lv:1,st:0,wr:0,ok:0,n:0,m:0};
// ---------- helpers ----------
let AC;const beep=(f,d,t=0)=>{if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.15,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}};
const say=t=>{if(!S.talk||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/▢/g,' what number ').replace(/=/g,' equals '));u.rate=.9;speechSynthesis.speak(u)};
const skipc=(n,k)=>Array.from({length:k},(_,i)=>n*(i+1)).join(', ');
const split=(a,b,o)=>{if(b<10)return `Count ${o=='+'?'up':'back'} ${b} from ${a}.`;const big=b>=1000?Math.floor(b/1000)*1000:b>=100?Math.floor(b/100)*100:Math.floor(b/10)*10,r=b-big,m=o=='+'?a+big:a-big;return `${a} ${o} ${big} = ${m}. Then ${m} ${o} ${r} = ${o=='+'?a+b:a-b}.`};
const dots=(a,b)=>a*b>100?'':'<div class=dots>'+Array.from({length:a},()=>'<div>'+'● '.repeat(b)+'</div>').join('')+'</div>';
const bar=(n,d)=>`<svg viewBox="0 0 ${d*40} 40" width="${Math.min(d*40,300)}">`+Array.from({length:d},(_,i)=>`<rect x="${i*40+2}" y="2" width="36" height="36" rx="6" fill="${i<n?'#fbbf24':'#fff'}" stroke="#3b5bdb" stroke-width="2.5"/>`).join('')+'</svg>';
const SETS=[[2,5,10],[3,4],[6,7],[8,9],[2,3,4,5,6,7,8,9,10]];
const NM=['Mia','Leo','Ava','Sam','Zoe','Max','Ivy','Ben'],IT=['stickers','apples','marbles','cards','cookies','pencils','shells'];
// ---------- skills: g(level) -> {q,a,h,v?,ch?} ----------
const SK={
add:{n:'Addition',e:'➕',c:'#3b5bdb',g(l){const r=[[1,10,1,10],[10,90,1,9],[11,79,11,39],[100,600,10,399],P([[200,999,200,999],[1000,5999,1000,3999]])][l-1];const a=R(r[0],r[1]),b=R(r[2],r[3]);return{q:`${a} + ${b}`,a:a+b,h:split(a,b,'+')}}},
sub:{n:'Subtraction',e:'➖',c:'#e8590c',g(l){let a,b;if(l==1){a=R(5,20);b=R(1,a)}else if(l==2){a=R(11,99);b=R(1,9)}else if(l==3){a=R(30,99);b=R(10,a-1)}else if(l==4){a=R(200,999);b=R(10,199)}else if(Math.random()<.5){a=R(300,1000);b=R(100,a-50)}else{a=R(2200,9999);b=R(1000,a-100)}return{q:`${a} − ${b}`,a:a-b,h:split(a,b,'−'.replace('−','-')).replace(/ - /g,' − ')}}},
mul:{n:'Multiply',e:'✖️',c:'#9c36b5',g(l){const s=SETS[l-1];let a=R(1,10),b=P(s);if(l==5&&Math.random()<.25){const x=R(12,29),y=R(2,6),t=x-x%10,o=x%10;return{q:`${x} × ${y}`,a:x*y,h:`Break ${x} into ${t} + ${o}: ${t} × ${y} = ${t*y} and ${o} × ${y} = ${o*y}. Add: ${x*y}.`}}if(l==5&&Math.random()<.4){a=R(2,9);b=R(1,9)*10;return{q:`${a} × ${b}`,a:a*b,h:`Do ${a} × ${b/10} = ${a*b/10}, then add a zero: ${a*b}.`}}if(Math.random()<.5)[a,b]=[b,a];return{q:`${a} × ${b}`,a:a*b,v:dots(a,b),h:`${a} groups of ${b}. Skip count by ${b}: ${skipc(b,Math.min(a,10))}`}}},
div:{n:'Divide',e:'➗',c:'#0b7285',g(l){const b=P(SETS[l-1].filter(x=>x>1)),q=R(1,10);return{q:`${b*q} ÷ ${b}`,a:q,h:`Think: ${b} × ? = ${b*q}. Skip count by ${b}: ${skipc(b,q)}`}}},
mis:{n:'Missing Number',e:'🔍',c:'#2b8a3e',g(l){const t=l<3?P(['+','-']):l<5?P(['×','÷']):P(['+','-','×','÷']),big=l<3?20:200;let x,y;
if(t=='+'){x=R(2,big);y=R(2,big);return{q:`▢ + ${x} = ${x+y}`,a:y,h:`Opposite of adding is subtracting: ${x+y} − ${x} = ${y}.`}}
if(t=='-'){y=R(2,big);x=y+R(2,big);return{q:`${x} − ▢ = ${x-y}`,a:y,h:`Subtract the answer from the start: ${x} − ${x-y} = ${y}.`}}
x=R(2,9);y=R(2,10);if(t=='×')return{q:`▢ × ${x} = ${x*y}`,a:y,h:`Opposite of times is divide: ${x*y} ÷ ${x} = ${y}.`};return{q:`${x*y} ÷ ▢ = ${y}`,a:x,h:`${x*y} ÷ ${y} = ${x}.`}}},
rnd:{n:'Rounding',e:'🎯',c:'#c2255c',g(l){let n,p;if(l==1){n=R(11,99);p=10}else if(l==2){n=R(101,999);p=100}else if(l==3){n=R(101,999);p=10}else if(l==4){n=R(101,999);p=P([10,100])}else{n=R(1001,9999);p=P([10,100])}const d=Math.floor(n/p)%10,pl=p==10?'ones':'tens';return{q:`Round ${n} to the nearest ${p}`,a:Math.round(n/p)*p,h:`Look at the ${pl} digit to the right: it is ${p==10?n%10:Math.floor(n/10)%10}. 5 or more rounds UP, 4 or less stays.`}}},
frac:{n:'Fractions',e:'🍕',c:'#d9480f',g(l){
if(l<=2){const d=l==1?P([2,3,4]):P([6,8,3,4]),n=R(1,d-1),s=new Set([n+'/'+d]);while(s.size<4){const e=P([d,d+1,d+2]);s.add(R(1,e-1)+'/'+e)}return{q:'What fraction is shaded?',v:bar(n,d),a:n+'/'+d,ch:sh([...s]),h:`Bottom number = equal parts (${d}). Top number = shaded parts (${n}).`}}
if(l==3){const d=P([3,4,6,8]);let x=R(1,d-1),y=R(1,d-1);while(y==x)y=R(1,d-1);return{q:'Which fraction is bigger?',a:Math.max(x,y)+'/'+d,ch:sh([x+'/'+d,y+'/'+d]),h:'Same bottom number: the bigger top number is the bigger fraction.'}}
if(l==4){const n=R(1,4);const ds=[2,3,4,6,8].filter(v=>v>n);let x=P(ds),y=P(ds);while(y==x)y=P(ds);return{q:'Which fraction is bigger?',a:n+'/'+Math.min(x,y),ch:sh([n+'/'+x,n+'/'+y]),h:'Same top number: a smaller bottom number means bigger pieces, so that fraction is bigger.'}}
const [n,d,m]=P([[1,2,2],[1,2,3],[1,2,4],[1,3,2],[2,3,2],[1,4,2],[3,4,2]]);return{q:`${n}/${d} = ▢/${d*m}`,a:n*m,h:`Multiply the top and bottom by ${m}: ${n}×${m} = ${n*m}.`}}},
wrd:{n:'Word Problems',e:'📖',c:'#5f3dc4',g(l){const n=P(NM),m=P(NM.filter(x=>x!=n)),i=P(IT),t=l<3?R(0,3):R(4,6),k=l*10;let a,b,c;
if(t==0){a=R(5,10+k);b=R(3,10+k);return{q:`${n} has ${a} ${i}. ${m} gives ${n} ${b} more. How many ${i} does ${n} have now?`,a:a+b,h:`"More" means add: ${a} + ${b}.`}}
if(t==1){a=R(15,40+k);b=R(3,a-1);return{q:`${n} had ${a} ${i} and gave ${b} away. How many are left?`,a:a-b,h:`"Gave away" means subtract: ${a} − ${b}.`}}
if(t==2){a=R(2,9);b=R(2,9);return{q:`There are ${a} bags with ${b} ${i} in each bag. How many ${i} in all?`,a:a*b,h:`Equal groups means multiply: ${a} × ${b}.`}}
if(t==3){b=R(2,9);c=R(2,9);return{q:`${n} shares ${b*c} ${i} equally among ${b} friends. How many does each friend get?`,a:c,h:`Sharing equally means divide: ${b*c} ÷ ${b}.`}}
if(t==4){a=R(10,40);b=R(5,30);c=R(3,a+b-1);return{q:`${n} has ${a} ${i}, then gets ${b} more, then gives away ${c}. How many are left?`,a:a+b-c,h:`Two steps. First ${a} + ${b} = ${a+b}. Then ${a+b} − ${c}.`}}
if(t==5){a=R(2,9);b=R(2,9);c=R(2,15);return{q:`${n} has ${a} boxes with ${b} ${i} in each box, plus ${c} loose ones. How many ${i} in all?`,a:a*b+c,h:`Two steps. First ${a} × ${b} = ${a*b}. Then add ${c}.`}}
a=R(4,9);c=R(1,a-1);b=R(2,9);return{q:`${n} has ${a} boxes of ${b} ${i}. ${n} gives ${c} boxes away. How many ${i} are left?`,a:(a-c)*b,h:`Two steps. Boxes left: ${a} − ${c} = ${a-c}. Then ${a-c} × ${b}.`}}}
};
const KEYS=Object.keys(SK);
// ---------- game ----------
let G=null;
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const today=()=>ds(new Date());
function start(mode,hw){const speed=mode=='speed',e=hw?((S.hw.log[today()]||{})[mode]||{p:0}):{p:0},off=e.p||0,N=hw?Math.max(1,S.hw.n-off):10;G={mode,hw:hw?1:0,off,q:[],i:0,ok:0,n:0,done:0,inp:'',lock:0,ups:[],t:60,tm:null,total:N,seen:new Set(),miss:[]};
const mk=()=>{if(G.seen.size>40)G.seen.clear();const id=speed?P(['mul','div']):mode=='mix'?P(KEYS):mode=='fix'?P(fixSkills()):mode;return pick(id,speed?5:sk(id).lv,mode=='fix'?1:.5)};G.mk=mk;
if(!speed)for(let i=0;i<N;i++)G.q.push(mk());else{G.q.push(mk());G.tm=setInterval(()=>{G.t--;const e=$('#tm');if(e)e.textContent='⏱ '+G.t;if(G.t<=0){clearInterval(G.tm);end()}},1000)}
show()}
function cur(){return G.q[0]}
function show(){G.inp='';const q=cur(),sp=G.mode=='speed';if(!q)return end();
let h=`<div class="row"><button class="btn alt" onclick="quit()" aria-label="Quit" style="padding:8px 14px">✕</button><div class=bar><i style="width:${sp?G.t/.6:(G.done+G.off)/(G.total+G.off)*100}%"></i></div>${sp?`<span class=chip id=tm>⏱ ${G.t}</span><span class=chip>✔ ${G.ok}</span>`:`<span class=chip>${G.done+G.off}/${G.total+G.off}</span>`}</div>
<div class=q>${!sp&&(G.mode=='mix'||G.mode=='fix')?`<div class=pips style="--c:${SK[q.s].c}">${SK[q.s].e} ${SK[q.s].n}</div>`:''}${q.v?`<div>${q.v}</div>`:''}<div class="${q.q.length>16?'s':'t'}">${q.q}${q.q.length>16?'':' = ?'}</div></div><div id=fb></div>`;
if(q.ch)h+=`<div class=ch>${q.ch.map(c=>`<button onclick="submit('${c}')">${c}</button>`).join('')}</div>`;
else h+=`<div class=ans id=ans>${G.inp||'&nbsp;'}</div><div class=pad>${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="key('b')" aria-label="Delete">⌫</button><button onclick="key('0')">0</button><button class=go style="background:var(--ok);color:#fff" onclick="key('e')" aria-label="Check">✓</button></div>`;
$('#app').innerHTML=h;G.lock=0;say(q.q)}
function key(k){if(!G||G.lock)return;if(k=='b')G.inp=G.inp.slice(0,-1);else if(k=='e'){if(G.inp)return submit(G.inp);return}else if(G.inp.length<5)G.inp+=k;$('#ans').innerHTML=G.inp||'&nbsp;'}
function submit(v){if(G.lock)return;G.lock=1;const q=cur(),ok=String(v)==String(q.a),sp=G.mode=='speed';
rec(q,ok);if(G.hw&&!q.r)hwRec(q.s,ok);if(!q.r&&!sp){const s=sk(q.s);s.n++;if(ok){s.ok++;s.st++;s.wr=0;if(s.st>=5&&s.lv<5){s.lv++;s.st=0;G.ups.push(`${SK[q.s].e} ${SK[q.s].n} → Level ${s.lv}!`)}if(s.lv==5&&s.st>=10&&!s.m){s.m=1;G.ups.push(`👑 ${SK[q.s].n} Master!`)}}else{s.st=0;s.wr++;if(s.wr>=2&&s.lv>1){s.lv--;s.wr=0}}}
G.n++;const a=$('#ans');if(a)a.className='ans '+(ok?'ok':'bad');
if(ok){G.ok++;S.xp+=q.r?5:10;beep(660,.12);beep(880,.15,.1);G.q.shift();if(!q.r)G.done++;
if(sp)G.q.push(G.mk());$('#fb').innerHTML=`<div class=fb style="background:#d1fae5">✅ ${P(['Yes!','Great job!','Nailed it!','Correct!','Super!'])}</div>`;setTimeout(()=>{if(G&&G.lock)show()},sp?350:750)}
else{beep(220,.3);G.q.shift();if(sp){G.q.push(G.mk());$('#fb').innerHTML=`<div class=fb>The answer was <b>${q.a}</b></div>`;setTimeout(()=>{if(G)show()},900)}
else{if(!q.r){G.done++;if(!q.ch&&q.s!='wrd')G.miss.push(q.q+' = '+q.a)}G.q.splice(Math.min(2,G.q.length),0,Object.assign({},q,{r:1}));$('#fb').innerHTML=`<div class=fb>Not yet — the answer is <b>${q.a}</b>.<br>💡 ${q.h}${q.v&&!q.ch?q.v:''}<br><small>We'll try this one again soon.</small></div><button class="btn go" style="width:100%" onclick="show()">Next</button><button class="chip" style="margin-top:10px" onclick="lesson('${q.s}')">📘 Review how to do this</button>`;}}
save()}
function end(){clearInterval(G&&G.tm);const sp=G.mode=='speed',acc=G.n?G.ok/G.n:0,st=sp?(G.ok>=20?3:G.ok>=12?2:1):(acc>=.9?3:acc>=.7?2:1);let rec='';
if(sp&&G.ok>S.speed){S.speed=G.ok;rec='🏆 New best!'}
if(G.sd)rec='🎉 Homework set complete!';S.stars+=st;const t=today();if(S.last!=t){const d=S.last?(Date.parse(t)-Date.parse(S.last))/864e5:9;S.days=d==1?S.days+1:1;S.last=t}save();
$('#app').innerHTML=`<div class=big>${'⭐'.repeat(st)}</div><h1 style="text-align:center">${sp?`${G.ok} correct in 60 seconds`:acc>=.9?'Amazing work!':acc>=.7?'Nice job!':'Keep practicing!'}</h1><p style="text-align:center;margin:8px 0 16px;color:var(--mut)">${rec||`${G.ok} of ${G.n} right on the first try or retry`}</p>${G.miss.length?`<div class=fb><b>Tricky ones to remember:</b><br>${G.miss.join('<br>')}</div>`:''}${G.ups.map(u=>`<div class=fb style="background:#e0e7ff;font-weight:700">${u}</div>`).join('')}<div class=row style="justify-content:center;margin-top:12px">${G.hw?`<button class=btn onclick="hw(0)">Homework log</button>`:`<button class=btn onclick="start('${G.mode}')">Play again</button>`}<button class="btn alt" onclick="home()">Home</button></div>`;G=null;beep(523,.15);beep(659,.15,.15);beep(784,.25,.3)}
function quit(){if(G)clearInterval(G.tm);G=null;home()}
// ---------- screens ----------
function home(){if(!S.name){$('#app').innerHTML=`<h1>Welcome to Math Quest! 🚀</h1><p style="margin-top:8px">What's your name?</p><input class=nm id=nm maxlength=20 autocomplete=off><button class="btn go" onclick="S.name=($('#nm').value.trim()||'Mathlete');save();home()">Let's go</button>`;return}
$('#app').innerHTML=`<div class="row sp"><h1>Hi, ${S.name.replace(/</g,'&lt;')}!</h1><div class=row><button class="chip" onclick="S.snd^=1;save();home()" aria-label="Sound">${S.snd?'🔊':'🔇'}</button><button class="chip" onclick="S.talk^=1;save();home()" aria-label="Read aloud">${S.talk?'🗣 on':'🗣 off'}</button></div></div>

const acc=o=>o.r.length?[...o.r].filter(c=>c=='1').length/o.r.length:0;

const weakN=()=>Object.keys(S.f).length+Object.values(S.tg).filter(o=>o.n>=4&&acc(o)<.7).length;
const nums=t=>(t.match(/\d+/g)||[]).map(Number);
const fk=q=>q.s+'|'+(q.s=='mul'?nums(q.q).sort((a,b)=>a-b).join('x'):q.q+(q.ch?[...q.ch].sort().join(','):''));
function tagsOf(q){const s=q.s,t=q.q,n=nums(t);
if(s=='mul'){if(n[0]>10&&n[1]<10)return['2-digit times 1-digit'];if(n[1]>10)return['times multiples of 10'];const x=[...new Set(n.filter(v=>v>=2).map(v=>v+'s times table'))];return x.length?x:['easy facts (x0, x1)']}
if(s=='div')return['dividing by '+n[1]];
if(s=='add'){if(n[0]+n[1]<=20)return['adding within 20'];const d=String(Math.max(n[0],n[1])).length,c=n[0]%10+n[1]%10>=10||Math.floor(n[0]/10)%10+Math.floor(n[1]/10)%10>=10;return[d+'-digit adding'+(c?' with carrying':'')]}
if(s=='sub'){if(n[0]<=20)return['subtracting within 20'];const d=String(n[0]).length,b=n[0]%10<n[1]%10||(d>=3&&Math.floor(n[0]/10)%10<Math.floor(n[1]/10)%10);return[d+'-digit subtracting'+(b?' with borrowing':'')]}
if(s=='mis')return['missing number ('+(t.includes('+')?'add':t.includes('−')?'subtract':t.includes('×')?'multiply':'divide')+')'];
if(s=='rnd')return['rounding to the nearest '+n[1]];
if(s=='frac')return[t.includes('shaded')?'reading shaded fractions':t.includes('bigger')?'comparing fractions':'equivalent fractions'];
return[q.h.startsWith('Two steps')?'two-step word problems':'one-step word problems']}
function rec(q,ok){if(!q.ch&&q.s!='wrd'){const k=fk(q);let f=S.f[k];if(!ok&&!f)f=S.f[k]={w:0,c:0,s:q.s,q:q.q+' = '+q.a};if(f){if(ok){f.c++;if(f.c>=3){delete S.f[k];S.fm=(S.fm||0)+1}}else{f.w++;f.c=0}}}
if(!q.r)tagsOf(q).forEach(t=>{const o=S.tg[t]=S.tg[t]||{n:0,ok:0,r:'',s:q.s};o.n++;if(ok)o.ok++;o.r=(o.r+(ok?1:0)).slice(-10)})}
function pick(id,lv,bias){const c=[];for(let i=0;i<40;i++){const o=SK[id].g(lv);o.s=id;c.push(o)}
const fr=c.filter(o=>!G.seen.has(fk(o))),pool=fr.length?fr:c,sc=o=>(S.f[fk(o)]?3:0)+tagsOf(o).filter(weakTag).length;let b=pool;
if(Math.random()<bias){const m=Math.max(...pool.map(sc));if(m>0)b=pool.filter(o=>sc(o)==m)}
const o=P(b);G.seen.add(fk(o));return o}
function fixSkills(){const a=new Set([...Object.values(S.tg).filter(o=>o.n>=4&&acc(o)<.7).map(o=>o.s),...Object.values(S.f).map(f=>f.s)]);return a.size?[...a]:KEYS}

const LS={
add:{t:'Adding big numbers',k:'TEKS 3.4A, 3.4B',big:'Add the same places together: ones with ones, tens with tens, hundreds with hundreds. If a place adds up to 10 or more, carry 1 to the next place.',demo:'addsub',tips:['1️⃣ Line up the places: ones under ones, tens under tens, hundreds under hundreds.','2️⃣ Start with the ones. If a place adds to 10 or more, write the ones digit and carry 1 to the next place.','3️⃣ Estimate first. Round both numbers to the nearest 100, add, and see if your answer is close.','4️⃣ Check it. Take one of the numbers away from your answer. You should get the other number back.','💡 Break apart if carrying feels tricky: 358 + 276 = (300 + 200) + (50 + 70) + (8 + 6).','🚀 4-digit numbers work the same way. There is just one more place: thousands.']},
sub:{t:'Subtracting big numbers',k:'TEKS 3.4A, 3.4B',big:'Subtract the same places. If the top digit is too small, borrow 1 from the next place. That 1 becomes 10 of the place you are working on.',demo:'addsub',tips:['1️⃣ The bigger number goes on top. Line up the places.','2️⃣ Start with the ones. If the top digit is smaller, borrow 1 from the next place to the left.','3️⃣ If the next place is 0, keep going left to the first digit that is not 0. Borrow from it. Each 0 in between turns into 9.','4️⃣ Count up to find the difference. For 1,000 − 457: 457 → 460 → 500 → 1,000. The jumps are 3 + 40 + 500 = 543.','5️⃣ Check with addition: your answer + the number you took away should equal the number you started with.','🚀 4-digit numbers work the same way. There is just one more place.']},

else if(m==1){if(add){st.push({t:`Break each number into place-value parts: ${a} = ${prt(a).join(' + ')} and ${b} = ${prt(b).join(' + ')}.`});const sm=[];for(let i=L-1;i>=0;i--){const x=(da[i]||0)*10**i,y=(db[i]||0)*10**i;if(x||y){sm.push(x+y);st.push({t:`${PL[i]}: ${x} + ${y} = ${x+y}`})}}st.push({t:`Add the pieces: ${sm.join(' + ')} = ${ans} ✅`})}

else if(k==1){const d=P([4,6,8]);let x=R(1,d-1),y=R(1,d-1);while(y==x)y=R(1,d-1);const hi=Math.max(x,y),lo=Math.min(x,y);h=`<div class=q><div class=t style="font-size:28px">${x}/${d} or ${y}/${d}?</div>${fb(x,d)}${fb(y,d)}</div>`;L=[`Same bottom number (${d}), so the pieces are the same size.`,`${hi} pieces is more than ${lo} pieces, so ${hi}/${d} is bigger ✅`]}
else{const n=R(1,3),ds=[2,3,4,6,8].filter(v=>v>n);let x=P(ds),y=P(ds);while(y==x)y=P(ds);const sm=Math.min(x,y);h=`<div class=q><div class=t style="font-size:28px">${n}/${x} or ${n}/${y}?</div>${fb(n,x)}${fb(n,y)}</div>`;L=[`Same top number (${n}), so we have the same number of pieces.`,`Cutting into ${sm} pieces makes bigger pieces than cutting into ${Math.max(x,y)}. So ${n}/${sm} is bigger ✅`]}
dshell('frac',h+fl(L),[['Equivalent',0],['Same bottom',1],['Same top',2]])}
};

const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],hwOn=()=>S.hw.on||KEYS,hwToday=()=>{const L=S.hw.log[today()]||{},on=hwOn();return on.filter(k=>L[k]&&L[k].c>=1).length+'/'+on.length+' today'};

function wk(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ds(x)})}
function hwRec(id,ok){const d=today(),L=S.hw.log[d]=S.hw.log[d]||{},e=L[id]=L[id]||{t:0,k:0,p:0,c:0};e.t++;if(ok)e.k++;e.p++;if(e.p>=S.hw.n){e.c++;e.p=0;G.sd=1}}
function wst(days){const on=hwOn();let sets=0,t=0,k=0,full=0;for(const d of days){const L=S.hw.log[d]||{};let all=on.length>0;for(const id of on){const e=L[id];if(e){sets+=e.c;t+=e.t;k+=e.k}if(!e||e.c<1)all=false}if(all)full++}return{sets,t,k,full}}
function hwSet(w,v){if(w=='n')S.hw.n=v;else{const on=[...hwOn()],i=on.indexOf(v);if(i>=0){if(on.length>1)on.splice(i,1)}else on.push(v);S.hw.on=KEYS.filter(k=>on.includes(k))}save();hw()}
function hw(o){if(G){clearInterval(G.tm);G=null}if(typeof o=='number')HW=o;
const days=wk(HW),t=today(),on=hwOn(),H=S.hw,n=H.n,st=wst(days),ps=wst(wk(HW-1)),pos=on.length*7,fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}),ent=(d,id)=>(H.log[d]||{})[id]||{t:0,k:0,p:0,c:0},pc=(k,t2)=>t2?Math.round(k/t2*100)+'%':'–';
let h=`<div class="row sp"><h1>📝 Homework log</h1><div class=row><button class="btn alt" onclick="window.print()" style="padding:8px 12px" aria-label="Print">🖨</button><button class="btn alt" onclick="home()" style="padding:8px 14px">Back</button></div></div>`;
if(HW==0)h+=`<h2>Today</h2><p style="color:var(--mut);font-size:14px">${n} problems from each section. Progress is saved if you stop in the middle.</p>`+on.map(id=>{const e=ent(t,id),fin=e.p==0&&e.c>0;return`<div class=hwr><div style="flex:1"><b>${SK[id].e} ${SK[id].n}</b><div class=bar style="margin:4px 0"><i style="width:${fin?100:e.p/n*100}%"></i></div><small>${fin?`Done ✅${e.c>1?' ×'+e.c:''}`:`${e.p}/${n}`}</small></div><button class="btn ${fin?'alt':'go'}" style="padding:10px 14px;font-size:16px" onclick="start('${id}',1)">${fin?'Again':e.p?'Continue':'Start'}</button></div>`}).join('');
h+=`<h2>Week summary</h2><div class="row sp"><button class=chip onclick="hw(${HW-1})" aria-label="Previous week">◀</button><b>${HW==0?'This week: ':''}${fmt(days[0])} – ${fmt(days[6])}</b><button class=chip ${HW>=0?'disabled style="opacity:.4"':''} onclick="hw(${HW+1})" aria-label="Next week">▶</button></div>
<div class=row style="margin:8px 0"><span class=chip>🌟 ${st.full}/7 full days</span><span class=chip>✅ ${st.sets}/${pos} sets</span><span class=chip>📝 ${st.t} problems</span><span class=chip>🎯 ${pc(st.k,st.t)} right</span></div>`;
if(st.t&&ps.t){const da=Math.round(st.k/st.t*100)-Math.round(ps.k/ps.t*100),dt=st.t-ps.t;h+=`<div class=fb>Compared with the week before: accuracy ${da>=0?'▲':'▼'} ${Math.abs(da)} points, problems ${dt>=0?'+':''}${dt}.</div>`}
else if(!st.t)h+=`<div class=fb>No homework logged this week yet.</div>`;
h+=`<table class=wk><tr><th></th>${days.map((d,i)=>`<th${d==t?' class=td':''}>${DN[i]}</th>`).join('')}<th>Sets</th></tr>${on.map(id=>`<tr><td>${SK[id].e}</td>${days.map(d=>{if(d>t)return'<td class=fu></td>';const e=ent(d,id);return`<td>${e.c?'✅'+(e.c>1?`<small>×${e.c}</small>`:''):e.p?'◐':'·'}</td>`}).join('')}<td><b>${days.reduce((a,d)=>a+ent(d,id).c,0)}</b></td></tr>`).join('')}<tr><td>🌟</td>${days.map(d=>d>t?'<td class=fu></td>':`<td>${on.every(id=>ent(d,id).c>=1)?'🌟':''}</td>`).join('')}<td></td></tr></table><p style="color:var(--mut);font-size:12px;margin:4px 0">✅ set finished   ◐ started   · nothing yet   🌟 every section done</p>`;
const sec=on.map(id=>{let c=0,t2=0,k=0;for(const d of days){const e=ent(d,id);c+=e.c;t2+=e.t;k+=e.k}return{id,c,t:t2,k,a:t2?k/t2:null}});
h+=`<h2>By section</h2><table><tr><th>Section<th>Sets<th>Problems<th>Right</tr>${sec.map(x=>`<tr><td>${SK[x.id].e} ${SK[x.id].n}<td>${x.c}<td>${x.t}<td>${pc(x.k,x.t)}</tr>`).join('')}</table>`;
const strong=sec.filter(x=>x.t>=10&&x.a>=.9).map(x=>SK[x.id].n),weak=sec.filter(x=>x.t>=10&&x.a<.7).sort((a,b)=>a.a-b.a).map(x=>SK[x.id].n);
if(strong.length)h+=`<div class=fb style="background:#d1fae5">⭐ Strong this week: ${strong.join(', ')}</div>`;
if(weak.length)h+=`<div class=fb>⚠️ Needs more practice: ${weak.join(', ')}. Try the lessons in 📘 Learn.</div>`;
h+=`<h2>Last 6 weeks</h2>`+Array.from({length:6},(_,i)=>{const o=HW-5+i,d=wk(o),w=wst(d);return`<div class=row style="margin:4px 0"><small style="width:52px">${fmt(d[0])}</small><div class=bar><i style="width:${Math.min(100,Math.round(w.sets/pos*100))}%"></i></div><small style="width:92px;text-align:right">${w.sets} sets, ${pc(w.k,w.t)}</small></div>`}).join('')+`<p style="color:var(--mut);font-size:12px">Bars show how many of the ${pos} weekly sets were finished.</p>`;
h+=`<h2>Settings</h2><p style="font-size:14px;margin-bottom:6px">Problems per section:</p><div class=row>${[10,15,20,25].map(v=>`<button class="chip${v==n?' on':''}" onclick="hwSet('n',${v})">${v}</button>`).join('')}</div><p style="font-size:14px;margin:10px 0 6px">Sections in homework:</p><div class=row>${KEYS.map(k=>`<button class="chip${on.includes(k)?' on':''}" onclick="hwSet('s','${k}')">${SK[k].e} ${SK[k].n}</button>`).join('')}</div><p style="color:var(--mut);font-size:12px;margin:10px 0 20px">Weeks run Monday to Sunday. Changes apply to future sets. Everything is saved in this browser on this device.</p>`;
$('#app').innerHTML=h}
